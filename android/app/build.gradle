plugins { id 'com.android.application' }

android {
    namespace 'space.readspace.android'
    compileSdk { version = release(36) { minorApiLevel = 1 } }
    defaultConfig {
        applicationId 'space.readspace.android'
        minSdk 24
        targetSdk 36
        versionCode 2
        versionName '1.0.1'
    }
    signingConfigs {
        release {
            if (System.getenv('READSPACE_ANDROID_KEYSTORE')) {
                storeFile file(System.getenv('READSPACE_ANDROID_KEYSTORE'))
                storePassword System.getenv('READSPACE_ANDROID_STORE_PASSWORD')
                keyAlias 'readspace'
                keyPassword System.getenv('READSPACE_ANDROID_STORE_PASSWORD')
            }
        }
    }
    buildTypes { release {
        signingConfig signingConfigs.release
        minifyEnabled true
        proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
    } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_11; targetCompatibility JavaVersion.VERSION_11 }
}
dependencies { testImplementation 'junit:junit:4.13.2' }
